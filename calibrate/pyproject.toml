[project]
name = "filmlab-calibrate"
version = "0.1.0"
description = "Measure camera film looks from RAW + JPEG pairs and fit 3D LUTs for Filmlab"
readme = "README.md"
authors = [
    { name = "Rahul Tarak", email = "cryogenicplanet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colour-science>=0.4.7",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "rawpy>=0.28.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
